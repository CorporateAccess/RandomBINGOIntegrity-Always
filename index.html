<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Integrity Bingo - Bright Edition</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;700;900&display=swap');

        * { margin:0; padding:0; box-sizing:border-box; font-family: 'Kanit', sans-serif; }

        body {
            height: 100vh; width: 100vw; overflow: hidden; margin: 0;
            background: #f8f9fa;
            background-image: 
                radial-gradient(circle at 20% 80%, rgba(241, 146, 30, 0.1) 0%, transparent 40%),
                radial-gradient(circle at 80% 20%, rgba(82, 67, 136, 0.1) 0%, transparent 40%);
            display: flex; flex-direction: column; color: #333;
        }

        .logo {
            position: absolute; top: 20px; right: 20px;
            width: 100px; height: 100px; z-index: 100;
            border-radius: 50%; box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        .bg-graph {
            position: absolute; bottom: 0; width: 100%; height: 200px;
            display: flex; justify-content: space-around; align-items: flex-end;
            padding: 0 10%; z-index: 0; opacity: 0.5;
        }
        .bar { width: 80px; background: #524388; border-radius: 10px 10px 0 0; animation: grow 3s infinite alternate; }
        .bar:nth-child(2) { background: #F1921E; animation-delay: 0.2s; }
        .bar:nth-child(3) { background: #4ecdc4; animation-delay: 0.4s; }
        @keyframes grow { from { height: 50px; } to { height: 150px; } }

        .header {
            height: 120px; display: flex; align-items: center; justify-content: center;
            font-size: 60px; font-weight: 900; color: #524388; letter-spacing: 2px;
            z-index: 1;
        }

        .main { display:flex; flex: 1; padding: 0 20px 20px; gap: 20px; overflow: hidden; z-index: 1; }

        .sidebar {
            width: 320px; background: rgba(255,255,255,0.9); backdrop-filter: blur(5px);
            border-radius: 25px; display: flex; flex-direction: column;
            border: 2px solid #524388; box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }

        .out-header {
            background: #524388; color: #fff; padding: 15px; text-align: center;
            font-size: 24px; font-weight: 900; border-radius: 20px 20px 0 0;
        }

        .out-list { flex: 1; overflow-y: auto; padding: 10px; }
        .out-item {
            background: #fff; color: #333; padding: 12px; margin-bottom: 8px;
            border-radius: 12px; display: flex; gap: 15px; font-weight: 700;
            border-left: 5px solid #F1921E; box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .center { flex: 1; display: flex; align-items: center; justify-content: center; }
        .board { width: 100%; max-width: 800px; text-align: center; }

        .word-box {
            min-height: 350px; width: 100%; background: #fff; border-radius: 40px;
            display: flex; align-items: center; justify-content: center; padding: 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1); border: 8px solid #524388;
            margin-bottom: 30px; overflow: hidden;
        }

        .word { font-weight: 900; color: #524388; white-space: nowrap; display: inline-block; }

        .button-wrap { display: flex; gap: 20px; justify-content: center; }
        button {
            border: none; padding: 20px 50px; border-radius: 50px; font-size: 24px;
            font-weight: 700; cursor: pointer; transition: 0.3s;
            box-shadow: 0 6px 15px rgba(0,0,0,0.1);
        }
        button:hover { transform: translateY(-5px); background: #3d3368; color: #fff; }
        .draw-btn { background: #F1921E; color: #fff; }
        .reset-btn { background: #eee; color: #333; }
    </style>
</head>
<body>

<img src="image_bc9682.png" alt="Logo" class="logo">

<div class="bg-graph">
    <div class="bar" style="height: 100px;"></div>
    <div class="bar" style="height: 140px;"></div>
    <div class="bar" style="height: 120px;"></div>
    <div class="bar" style="height: 160px;"></div>
</div>

<div class="header">INTEGRITY BINGO</div>

<div class="main">
    <div class="sidebar">
        <div class="out-header">รายการที่ออกแล้ว</div>
        <div class="out-list" id="history"></div>
    </div>
    <div class="center">
        <div class="board">
            <div class="word-box"><div class="word" id="current">-</div></div>
            <div class="button-wrap">
                <button class="draw-btn" onclick="draw()" id="btn">🎲 สุ่มคำ</button>
                <button class="reset-btn" onclick="resetGame()">🔄 เริ่มใหม่</button>
            </div>
        </div>
    </div>
</div>

<script>
    const words = ["Accountability","Authenticity","Commitment","Empathy","Ethical","Fair","Honest","Integrity","Principle","Reliable","Respect","Sincere","Transparency","Trustworthy","กล้าหาญ","ขยัน","คุณธรรม","จริงใจ","ใจกว้าง","ชัดเจน","ซื่อสัตย์","ตั้งใจ","ถูกต้อง","น่าเชื่อถือ","โปร่งใส","พัฒนา","มั่นคง","มีวินัย","เมตตา","ยุติธรรม","ร่วมมือ","รอบคอบ","รับผิดชอบ","เรียนรู้","สม่ำเสมอ","สามัคคี","สุจริต","เสียสละ","ให้เกียรติ","อดทน"];
    let remaining = [...words];
    let used = [];

    function fitText(el) {
        let size = 120;
        el.style.fontSize = size + "px";
        while(el.scrollWidth > (el.parentElement.clientWidth - 80) && size > 40){
            size -= 2;
            el.style.fontSize = size + "px";
        }
    }

    function draw(){
        const btn = document.getElementById('btn');
        const display = document.getElementById('current');
        if (remaining.length === 0) { alert("หมดคำแล้ว!"); return; }
        btn.disabled = true;
        let spin = 0;
        const interval = setInterval(()=>{
            display.innerText = words[Math.floor(Math.random()*words.length)];
            fitText(display);
            spin++;
            if(spin > 15){
                clearInterval(interval);
                const picked = remaining.splice(Math.floor(Math.random()*remaining.length), 1)[0];
                used.unshift(picked);
                display.innerText = picked;
                fitText(display);
                renderHistory();
                btn.disabled = false;
            }
        }, 80);
    }

    function resetGame(){
        if(confirm("เริ่มเกมใหม่ใช่ไหม?")){
            remaining = [...words];
            used = [];
            document.getElementById('current').innerText = '-';
            document.getElementById('history').innerHTML = '';
        }
    }

    function renderHistory(){
        document.getElementById('history').innerHTML = used.map((w,i) => 
            `<div class="out-item"><div>${used.length - i}.</div><div>${w}</div></div>`
        ).join('');
    }
</script>
</body>
</html>
